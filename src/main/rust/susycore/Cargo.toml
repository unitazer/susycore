[package]
name = "susycore"
version = "0.1.1"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]
name = "susycore"
path = "src/lib.rs"

[dependencies]
color = "0.3.3"
itertools = "0.15"
jni = { workspace = true, features = ["invocation"] }
log = "0.4"
once_cell = "1.21.4"
ordered-float = "5.3.0"
# rapier3d = { version = "0.32", features = ["parallel", "serde-serialize", "simd-stable"] }
#disabled parallel so that its easier to debug
rapier3d = { version = "0.33", features = ["debug-render", "serde-serialize", "simd-stable"] }
[build-dependencies]
gl_generator = "0.14"
[profile.dev.package."*"]
opt-level = 3
